name: ops-health-check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to check
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
          - production-remote-diagnostic

jobs:
  health-check-production:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'production' }}
    runs-on: [self-hosted, prod-vm, prod-deploy]
    environment: production
    concurrency:
      group: ops-health-check-production
      cancel-in-progress: false
    env:
      YC_VM_DEPLOY_PATH: ${{ secrets.YC_VM_DEPLOY_PATH }}
    steps:
      - name: Skip health check when VM deploy path is not configured
        if: ${{ env.YC_VM_DEPLOY_PATH == '' }}
        run: |
          echo "Skipping production health check because YC_VM_DEPLOY_PATH is missing."

      - name: Run production stack health checks
        if: ${{ env.YC_VM_DEPLOY_PATH != '' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cd "${YC_VM_DEPLOY_PATH}"
          expected_release_id="$(git rev-parse HEAD)"
          bash ./scripts/check-stack-health.sh --env-file .env --compose-file docker-compose.prod.yml --verify-runtime-state --expected-release-id "$expected_release_id"

  health-check-staging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ops-health-check-staging
      cancel-in-progress: false
    env:
      YC_VM_HOST: ${{ secrets.YC_VM_HOST }}
      YC_VM_USER: ${{ secrets.YC_VM_USER }}
      YC_VM_SSH_KEY: ${{ secrets.YC_VM_SSH_KEY }}
      YC_VM_DEPLOY_PATH: ${{ secrets.YC_VM_DEPLOY_PATH }}
    steps:
      - name: Skip health check when VM secrets are not configured
        if: ${{ env.YC_VM_HOST == '' || env.YC_VM_USER == '' || env.YC_VM_SSH_KEY == '' || env.YC_VM_DEPLOY_PATH == '' }}
        run: |
          echo "Skipping health check because one or more VM deployment secrets are missing."

      - name: Run remote stack health checks
        if: ${{ env.YC_VM_HOST != '' && env.YC_VM_USER != '' && env.YC_VM_SSH_KEY != '' && env.YC_VM_DEPLOY_PATH != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.YC_VM_HOST }}
          username: ${{ env.YC_VM_USER }}
          key: ${{ env.YC_VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ${{ env.YC_VM_DEPLOY_PATH }}
            expected_release_id="$(git rev-parse HEAD)"
            bash ./scripts/check-stack-health.sh --env-file .env --compose-file docker-compose.prod.yml --verify-runtime-state --expected-release-id "$expected_release_id"

  diagnose-production-remotely:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production-remote-diagnostic' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      YC_VM_HOST: ${{ secrets.YC_VM_HOST }}
      YC_VM_USER: ${{ secrets.YC_VM_USER }}
      YC_VM_SSH_KEY: ${{ secrets.YC_VM_SSH_KEY }}
      YC_VM_DEPLOY_PATH: ${{ secrets.YC_VM_DEPLOY_PATH }}
    steps:
      - name: Require production VM SSH configuration
        run: |
          set -euo pipefail
          test -n "${YC_VM_HOST}"
          test -n "${YC_VM_USER}"
          test -n "${YC_VM_SSH_KEY}"
          test -n "${YC_VM_DEPLOY_PATH}"

      - name: Inspect production host without changing it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.YC_VM_HOST }}
          username: ${{ env.YC_VM_USER }}
          key: ${{ env.YC_VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -u
            cd "${{ env.YC_VM_DEPLOY_PATH }}"
            echo "## Host"
            date -u
            uptime
            free -m
            df -h /
            lsblk -o NAME,PATH,SIZE,TYPE,FSTYPE,MOUNTPOINTS
            findmnt -no SOURCE,FSTYPE,OPTIONS /
            if sudo -n true 2>/dev/null; then
              echo "passwordless_sudo=yes"
            else
              echo "passwordless_sudo=no"
            fi
            echo "## Runner"
            systemctl list-units --type=service --all 'actions.runner*' --no-pager || true
            systemctl --user list-units --type=service --all 'actions.runner*' --no-pager || true
            echo "## Containers"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            docker compose --env-file .env -f docker-compose.prod.yml ps -a || true
            echo "## Docker storage"
            docker system df -v || true
            echo "## Deploy-path storage"
            du -xhd1 . .deploy-state releases backups 2>/dev/null | sort -h || true
            echo "## Release directories"
            du -xhd1 releases/* 2>/dev/null | sort -h || true
            echo "## Backup files"
            find backups .deploy-state -xdev -type f -printf '%s %TY-%Tm-%TdT%TH:%TM:%TSZ %p\n' 2>/dev/null \
              | sort -n \
              | tail -n 80 || true
            echo "## Container log paths"
            docker inspect --format '{{.Name}} {{.LogPath}}' $(docker ps -aq) 2>/dev/null || true
            journalctl --disk-usage 2>/dev/null || true
            echo "## Runtime state"
            sed -n '1,160p' .deploy-state/runtime-live.env 2>/dev/null || true
            sed -n '1,200p' .deploy-state/latest-runtime-summary.txt 2>/dev/null || true
            echo "## Latest deployment log"
            latest_log="$(ls -1t .deploy-state/logs/*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "${latest_log}" ]; then
              echo "${latest_log}"
              tail -n 300 "${latest_log}"
            fi
