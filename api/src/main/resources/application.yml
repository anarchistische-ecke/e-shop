logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%thread] %logger{36} : %msg %kvp%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: eshop-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
        cms.directus.request: true

mail:
  from: ${MAIL_FROM:yug-postel@yandex.ru}
  reply-to: ${MAIL_REPLY_TO:}

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:true}
  max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:3}
  retry-delay: ${NOTIFICATIONS_RETRY_DELAY:5m}
  batch-size: ${NOTIFICATIONS_BATCH_SIZE:20}
  dispatcher:
    enabled: ${NOTIFICATIONS_DISPATCHER_ENABLED:true}
    fixed-delay-ms: ${NOTIFICATIONS_DISPATCHER_FIXED_DELAY_MS:30000}
  tracking-url-templates:
    cdek: ${NOTIFICATIONS_TRACKING_URL_CDEK:https://www.cdek.ru/ru/tracking?order_id={trackingNumber}}
    pochta: ${NOTIFICATIONS_TRACKING_URL_POCHTA:https://www.pochta.ru/tracking#{trackingNumber}}
    boxberry: ${NOTIFICATIONS_TRACKING_URL_BOXBERRY:https://boxberry.ru/tracking-page?id={trackingNumber}}

chat:
  enabled: ${CHAT_ENABLED:true}
  max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:2000}
  max-attempts: ${CHAT_DELIVERY_MAX_ATTEMPTS:3}
  retry-delay: ${CHAT_DELIVERY_RETRY_DELAY:30s}
  batch-size: ${CHAT_DELIVERY_BATCH_SIZE:20}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    manager-chat-id: ${TELEGRAM_MANAGER_CHAT_ID:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    dispatcher-enabled: ${CHAT_TELEGRAM_DISPATCHER_ENABLED:false}
    dispatcher-fixed-delay-ms: ${CHAT_TELEGRAM_DISPATCHER_FIXED_DELAY_MS:5000}

metrika:
  enabled: ${YANDEX_METRIKA_ENABLED:false}
  counter-id: ${YANDEX_METRIKA_COUNTER_ID:}
  oauth-token: ${YANDEX_METRIKA_OAUTH_TOKEN:}
  batch-size: ${YANDEX_METRIKA_BATCH_SIZE:20}
  max-attempts: ${YANDEX_METRIKA_MAX_ATTEMPTS:6}
  retry-delay: ${YANDEX_METRIKA_RETRY_DELAY:10m}
  offline-import:
    enabled: ${YANDEX_METRIKA_OFFLINE_IMPORT_ENABLED:false}
    url: ${YANDEX_METRIKA_OFFLINE_IMPORT_URL:}
  dispatcher:
    enabled: ${YANDEX_METRIKA_DISPATCHER_ENABLED:true}
    fixed-delay-ms: ${YANDEX_METRIKA_DISPATCHER_FIXED_DELAY_MS:60000}

app:
  security:
    directus-bridge-token: ${DIRECTUS_BRIDGE_TOKEN:}
  observability:
    prometheus-token: ${APP_OBSERVABILITY_PROMETHEUS_TOKEN:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    checkout:
      limit: ${APP_RATE_LIMIT_CHECKOUT_LIMIT:10}
      window-seconds: ${APP_RATE_LIMIT_CHECKOUT_WINDOW_SECONDS:60}
    cart:
      limit: ${APP_RATE_LIMIT_CART_LIMIT:90}
      window-seconds: ${APP_RATE_LIMIT_CART_WINDOW_SECONDS:60}
    order-token:
      limit: ${APP_RATE_LIMIT_ORDER_TOKEN_LIMIT:30}
      window-seconds: ${APP_RATE_LIMIT_ORDER_TOKEN_WINDOW_SECONDS:60}
    webhook:
      limit: ${APP_RATE_LIMIT_WEBHOOK_LIMIT:120}
      window-seconds: ${APP_RATE_LIMIT_WEBHOOK_WINDOW_SECONDS:60}
    chat-start:
      limit: ${APP_RATE_LIMIT_CHAT_START_LIMIT:6}
      window-seconds: ${APP_RATE_LIMIT_CHAT_START_WINDOW_SECONDS:60}
    chat-message:
      limit: ${APP_RATE_LIMIT_CHAT_MESSAGE_LIMIT:60}
      window-seconds: ${APP_RATE_LIMIT_CHAT_MESSAGE_WINDOW_SECONDS:60}
    privileged:
      limit: ${APP_RATE_LIMIT_PRIVILEGED_LIMIT:120}
      window-seconds: ${APP_RATE_LIMIT_PRIVILEGED_WINDOW_SECONDS:60}

auth:
  magic-link:
    enabled: ${AUTH_MAGIC_LINK_ENABLED:true}
    keycloak-base-url: ${AUTH_MAGIC_LINK_KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${AUTH_MAGIC_LINK_REALM:cozyhome}
    admin-client-id: ${AUTH_MAGIC_LINK_ADMIN_CLIENT_ID:magic-link-service}
    admin-client-secret: ${AUTH_MAGIC_LINK_ADMIN_CLIENT_SECRET:}
    storefront-client-id: ${AUTH_MAGIC_LINK_STOREFRONT_CLIENT_ID:cozyhome-web}
    customer-role: ${AUTH_MAGIC_LINK_CUSTOMER_ROLE:customer}
    lifespan: ${AUTH_MAGIC_LINK_LIFESPAN:15m}
    cooldown: ${AUTH_MAGIC_LINK_COOLDOWN:60s}
    allowed-redirect-origins: ${AUTH_MAGIC_LINK_ALLOWED_REDIRECT_ORIGINS:http://localhost:3000}

media:
  derivatives:
    public-base-url: ${MEDIA_DERIVATIVES_PUBLIC_BASE_URL:https://img.yug-postel.ru}
    path-prefix: ${MEDIA_DERIVATIVES_PATH_PREFIX:media}

catalogue:
  media:
    upload:
      enabled: ${CATALOGUE_MEDIA_UPLOAD_ENABLED:false}
      processor-enabled: ${CATALOGUE_MEDIA_PROCESSOR_ENABLED:true}
      max-file-size: ${CATALOGUE_MEDIA_MAX_FILE_SIZE:100MB}
      max-pixels: ${CATALOGUE_MEDIA_MAX_PIXELS:100000000}
      single-put-threshold: ${CATALOGUE_MEDIA_SINGLE_PUT_THRESHOLD:16MB}
      multipart-part-size: ${CATALOGUE_MEDIA_MULTIPART_PART_SIZE:8MB}
      url-ttl: ${CATALOGUE_MEDIA_UPLOAD_URL_TTL:PT1H}
      session-ttl: ${CATALOGUE_MEDIA_UPLOAD_SESSION_TTL:P7D}
      record-ttl: ${CATALOGUE_MEDIA_UPLOAD_RECORD_TTL:P30D}
      lock-ttl: ${CATALOGUE_MEDIA_PROCESSING_LOCK_TTL:PT5M}
      lock-refresh-interval: ${CATALOGUE_MEDIA_PROCESSING_LOCK_REFRESH_INTERVAL:PT30S}
      worker-fixed-delay-ms: ${CATALOGUE_MEDIA_WORKER_FIXED_DELAY_MS:2000}
      pending-prefix: ${CATALOGUE_MEDIA_PENDING_PREFIX:media-upload-pending}
      derivative-bucket: ${MEDIA_DERIVATIVES_BUCKET:}
      derivative-path-prefix: ${MEDIA_DERIVATIVES_PATH_PREFIX:media}
      node-executable: ${MEDIA_IMAGE_NODE_EXECUTABLE:/usr/local/bin/node}
      processor-script: ${MEDIA_IMAGE_PROCESSOR_SCRIPT:/app/media/process-image.mjs}
      derivative-config: ${MEDIA_DERIVATIVES_CONFIG:/app/media/media-derivatives.json}
